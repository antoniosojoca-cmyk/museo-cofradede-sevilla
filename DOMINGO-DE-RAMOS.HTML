
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Domingo de Ramos | Museo Cofrade de Sevilla</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
   ========================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #ffffff;
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
}


/* =========================================
   CABECERA
   ========================================= */

header {
  padding: 55px 20px 40px;
  border-bottom: 1px solid #c9a35b;
}

header h1 {
  margin: 0;
  color: #ffffff;
  font-size: 38px;
  letter-spacing: 5px;
}

.subtitulo {
  color: #c9a35b;
  font-size: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 25px;
}

.linea {
  width: 100px;
  height: 1px;
  background: #c9a35b;
  margin: 25px auto;
}


/* =========================================
   CONTENEDOR
   ========================================= */

.contenedor {
  width: min(1000px, 92%);
  margin: 55px auto 80px;
}


/* =========================================
   MÚSICA
   ========================================= */

.musica {
  margin: 0 auto 65px;
}

.boton-musica {
  display: inline-block;

  padding: 14px 30px;

  background: #111111;

  color: #c9a35b;

  border: 1px solid #c9a35b;

  font-family: Georgia, serif;

  font-size: 16px;

  letter-spacing: 2px;

  cursor: pointer;

  transition: 0.3s;
}

.boton-musica:hover {
  background: #c9a35b;
  color: #080808;
}

.youtube-oculto {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}


/* =========================================
   PIEZAS — MARCO EXTERIOR
   ========================================= */

.pieza {

  background: #101010;

  border: 1px solid #c9a35b;

  padding: 30px;

  margin-bottom: 70px;

  text-align: center;

}


/* =========================================
   NÚMERO DE PIEZA
   ========================================= */

.pieza-numero {

  color: #c9a35b;

  font-size: 13px;

  letter-spacing: 5px;

  margin-bottom: 18px;

}


/* =========================================
   TÍTULO
   ========================================= */

.pieza h2 {

  color: #ffffff;

  font-size: 25px;

  letter-spacing: 3px;

  line-height: 1.4;

  margin: 0 0 25px;

}


/* =========================================
   IMAGEN — MARCO INTERIOR
   ========================================= */

.pieza img {

  width: 100%;

  max-width: none;

  height: auto;

  display: block;

  margin: 0 auto;

  border: 1px solid #c9a35b;

  box-shadow:
    0 0 25px rgba(201,163,91,0.08);

}


/* =========================================
   SEPARADOR
   ========================================= */

.separador {

  width: 60px;

  height: 1px;

  background: #c9a35b;

  margin: 0 auto 70px;

}


/* =========================================
   VOLVER
   ========================================= */

.volver {

  display: block;

  width: fit-content;

  margin: 20px auto 0;

  padding: 11px 24px;

  border: 1px solid #c9a35b;

  color: #c9a35b;

  text-decoration: none;

  font-size: 12px;

  letter-spacing: 2px;

  transition: all 0.3s ease;

}

.volver:hover {

  background: #c9a35b;

  color: #080808;

}


/* =========================================
   PIE DE PÁGINA
   ========================================= */

footer {

  border-top: 1px solid #222222;

  text-align: center;

  padding: 30px 20px 45px;

  color: #777777;

  font-size: 12px;

  letter-spacing: 1px;

  line-height: 1.8;

}


/* =========================================
   MÓVIL
   ========================================= */

@media (max-width: 700px) {

  header {
    padding: 45px 18px 35px;
  }

  header h1 {
    font-size: 29px;
    letter-spacing: 3px;
  }

  .subtitulo {
    font-size: 18px;
    letter-spacing: 2px;
  }

  .contenedor {
    width: 92%;
    margin-top: 40px;
  }

  .pieza {
    padding: 20px;
    margin-bottom: 55px;
  }

  .pieza h2 {
    font-size: 21px;
    letter-spacing: 2px;
  }

}

</style>

</head>


<body>


<!-- =========================================

<header>

  <section class="pieza">

    </div>

    </h2>

  </section>


  <div class="separador"></div>



  <!-- =========================================
       PIEZA IV

  <section class="pieza">

    </div>

    <h2>

    </h2>

  <!-- =========================================

  <a

  </a>


</div>


<!-- =========================================
     PIE DE PÁGINA
     ========================================= -->

<footer>

  MUSEO COFRADE DE SEVILLA

</footer>


<script>

function reproducirMusica() {

  const iframe =
    document.getElementById("youtube");

  iframe.src =
    "https://www.youtube.com/embed/QxklwhOydco?autoplay=1&enablejsapi=1";

}

</script>


</body>

</html>
