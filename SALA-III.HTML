<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sala III — Miércoles Santo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 60px 25px;
    }

    .sala-titulo {
      text-align: center;
      margin-bottom: 50px;
    }

    .sala-titulo h1 {
      color: #c9a35b;
      font-size: 42px;
      letter-spacing: 4px;
      margin: 0;
    }

    .sala-titulo h2 {
      color: #ffffff;
      font-size: 24px;
      letter-spacing: 3px;
      margin-top: 12px;
    }

    .linea-dorada {
      width: 100px;
      height: 2px;
      background: #c9a35b;
      margin: 25px auto;
    }

    .pieza {
      background: #111111;
      border: 1px solid #c9a35b;
      padding: 30px;
      margin-bottom: 45px;
      text-align: center;
    }

    .pieza img {
      width: 100%;
      max-width: 650px;
      height: auto;
      display: block;
      margin: 0 auto 25px;
    }

    .pieza-numero {
      color: #c9a35b;
      font-size: 15px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .pieza h2 {
      color: #ffffff;
      font-size: 28px;
      margin: 10px 0 20px;
    }

    .pieza-texto {
      max-width: 750px;
      margin: auto;
      color: #dddddd;
      font-size: 17px;
      line-height: 1.7;
    }

    .volver {
      display: block;
      width: fit-content;
      margin: 40px auto 0;
      padding: 12px 25px;
      border: 1px solid #c9a35b;
      color: #c9a35b;
      text-decoration: none;
      letter-spacing: 2px;
    }

    .volver:hover {
      background: #c9a35b;
      color: #080808;
    }
  </style>
</head>

<body>

  <main>

    <div class="sala-titulo">
      <h1>SALA III</h1>
      <div class="linea-dorada"></div>
      <h2>MIÉRCOLES SANTO</h2>
    </div>

    <div class="pieza">

      <img
        src="884bd98fad944b1cf56f5b582be80257.jpg"
        alt="Cristo de Burgos">

      <div class="pieza-numero">
        PIEZA I
      </div>

      <h2>
        CRISTO DE BURGOS
      </h2>

      <p class="pieza-texto">
        El Santísimo Cristo de Burgos,
        una de las imágenes más veneradas
        de la Semana Santa de Sevilla,
        protagonista del Miércoles Santo.
      </p>

    </div>

    <a class="volver" href="index.html">
      VOLVER AL MUSEO
    </a>

  </main>

</body>
</html>
