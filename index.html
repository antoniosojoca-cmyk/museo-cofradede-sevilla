<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Museo Cofrade de Sevilla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
    }

    .portada {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 25px;
    }

    .titulo {
      color: #c9a35b;
      font-size: 46px;
      letter-spacing: 7px;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .subtitulo {
      color: #eeeeee;
      font-size: 18px;
      letter-spacing: 3px;
      line-height: 1.7;
      max-width: 750px;
    }

    .linea {
      width: 120px;
      height: 2px;
      background: #c9a35b;
      margin: 30px auto;
    }

    .imagen-portada {
      width: min(1000px, 100%);
      height: 430px;
      margin: 15px 0 35px;
      border: 1px solid #c9a35b;
      background:
        linear-gradient(
          rgba(0,0,0,0.25),
          rgba(0,0,0,0.55)
        ),
        #151515;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
      letter-spacing: 3px;
      font-size: 14px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      max-width: 1000px;
    }

    .menu a {
      color: #c9a35b;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .menu a:hover {
      color: #ffffff;
    }
.boton-museo {
  display: inline-block;
  padding: 16px 38px;
  border: 1px solid #c9a35b;
  color: #c9a35b;
  text-decoration: none;
  letter-spacing: 3px;
  font-size: 15px;
  transition: 0.3s;
  margin-top: 5px;
}

.boton-museo:hover {
  background: #c9a35b;
  color: #080808;
}
    .frase {
      margin-top: 35px;
      color: #aaaaaa;
      font-size: 15px;
      font-style: italic;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {
      .titulo {
        font-size: 30px;
        letter-spacing: 4px;
      }

      .subtitulo {
        font-size: 15px;
      }

      .imagen-portada {
        height: 300px;
      }

      .menu {
        gap: 18px;
      }
    }
  </style>
</head>
<!-- Museo Cofrade de Sevilla -->
<body>

  <main class="portada">

    <div class="titulo">
      Museo Cofrade de Sevilla
    </div>

    <div class="subtitulo">
      Un viaje por la historia, el arte y la devoción
      de nuestra Semana Santa
    </div>

    <div class="linea"></div>

    <div class="imagen-portada">
      IMAGEN DE PORTADA
    </div>

    <nav class="menu">
      <a href="#">INICIO</a>
      <a href="#">EL MUSEO</a>
      <a href="#">SALAS</a>
      <a href="#">GALERÍAS</a>
      <a href="#">HISTORIA</a>
      <a href="#">HERMANDADES</a>
      <a href="#">MEMORIA</a>
    </nav>
<a class="boton-museo" href="#sala-sevilla">
  ENTRAR AL MUSEO
</a>
    <div class="frase">
      Donde la memoria se convierte en arte.
    </div>

  </main>

</body>
</html>
